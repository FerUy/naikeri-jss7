# Log4j2 equivalent configuration
status = INFO
name = PropertiesConfig

# Console appender
appender.console.type = Console
appender.console.name = A1
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-4r [%t] %-5p %c %x - %m%n

# File appender
appender.rolling.type = RollingFile
appender.rolling.name = R
appender.rolling.fileName = debuglog.txt
appender.rolling.filePattern = debuglog-%i.txt
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{ISO8601}]%5p%6.6r[%t]%x - %C.%M(%F:%L) - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 1

# Root logger
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = A1
rootLogger.appenderRef.rolling.ref = R

# Package loggers
logger.mobicents.name = org.mobicents
logger.mobicents.level = DEBUG

logger.restcomm.name = org.restcomm
logger.restcomm.level = DEBUG