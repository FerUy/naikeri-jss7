# Log4j2 Configuration in properties format
status = WARN
name = PropertiesConfig

# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-4r [%t] %-5p %c %x - %m%n

# Rolling File Appender
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${sys:log.file.name}
appender.rolling.filePattern = ${sys:log.file.name}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{ISO8601}]%5p%6.6r[%t]%x - %C.%M(%F:%L) - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 100

# Logger configurations
logger.map-load.name = org.restcomm.protocols.ss7.map.load
logger.map-load.level = WARN

logger.map.name = org.restcomm.protocols.ss7.map
logger.map.level = WARN

# Root logger
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.rolling.ref = RollingFile

