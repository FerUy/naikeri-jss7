# Adding to Eclipse: VM arguments: -Dlog4j.configurationFile=file:e:\git\jss7\m3ua\impl\src\test\resources\log4j2.properties
# Root logger level and appenders
rootLogger.level=INFO
rootLogger.appenderRef.console.ref=STDOUT
rootLogger.appenderRef.file.ref=FILE

# Console appender configuration
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%-4r [%t] %-5p %c %x - %m%n

# File appender configuration
appender.file.type=RollingFile
appender.file.name=FILE
appender.file.fileName=debuglog.txt
appender.file.filePattern=debuglog-%i.txt
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%d{ISO8601}]%5p%6.6r[%t]%x - %C.%M(%F:%L) - %m%n
appender.file.policies.type=Policies
appender.file.policies.size.type=SizeBasedTriggeringPolicy
appender.file.policies.size.size=10MB
appender.file.strategy.type=DefaultRolloverStrategy
appender.file.strategy.max=1

# Logger configurations
logger.mobicents.name=org.mobicents
logger.mobicents.level=DEBUG

logger.restcomm.name=org.restcomm
logger.restcomm.level=DEBUG

