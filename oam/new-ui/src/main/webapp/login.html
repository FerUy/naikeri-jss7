<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/png" href="resources/public/favicon.png">

    <style type="text/css">

        .login_container{
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;"
        }

        .login_form{
            width: 450px;
            border-radius: 10px;
            padding: 25px;
            background-color: whitesmoke;
        }

        .my-3 {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .full-width {
            width: 100%;
        }

        /*!*ui elemts*!*/

        .el-button--primary {
            color: #FFFFFF;
            background-color: #223A8B;
            border-color: #223A8B;
        }

        .el-input__inner:hover{
            border-color:#223A8B !important;
        }

        .el-input__inner:focus{
            border-color:#223A8B !important;
        }
    </style>

    <script src="resources/public/vue.js"></script>

    <link href="resources/public/element-ui.css" rel="stylesheet">
</head>

        <el-form action="j_security_check" method=post>
            <el-form-item prop="user" class="my-3" >
                <el-input
                        name="j_username"
                        v-model="user"
                        placeholder="user"
                        clearable
                        prefix-icon="el-icon-eleme"></el-input>
            </el-form-item>
            <el-form-item prop="password" class="my-3">
                <el-input
                        name="j_password"
                        v-model="pass"
                        type="password"
                        placeholder="**********"
                        clearable
                        prefix-icon="el-icon-date"></el-input>
            </el-form-item>

            <el-button
                    class="full-width"
                    type="primary"
                    native-type="submit"
                    icon="el-icon-mouse">
                Sign In</el-button>

        </el-form>
        <br/>
        <div v-if="error">
            <el-alert
                    :title="error"
                    type="error"
                    show-icon>
            </el-alert>
        </div>
    </div>
</div>
<script src="resources/public/element-ui.js"></script>
<script type="text/javascript">
    var app = new Vue({
        el: '#app',
        data:{
            user: '',
            pass: '',
            error: ''
        },
        created(){
            var currentUrl = window.location.pathname;
            var n = currentUrl.includes("j_security_check");
            if(n){
                console.log('error ...');
                this.error = 'Wrong user name or password';
            }
        }
    })
</script>
